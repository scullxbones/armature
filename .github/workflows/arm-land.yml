# ADR 0026 N1 (#481): post-merge apply via `arm land --pr` + scheduled sweep.
# Workflow token only — no new secrets. Token never written into git config /
# remote URL. networkCmd and scripts/github-actions-git-auth.sh send
# Authorization: basic base64(x-access-token:TOKEN) for github.com.
# workflow_dispatch input proof pushes refs/heads/_armature-ci-proof/<run_id>
# and deletes it. That path does not publish _armature and does not land PRs.
name: Arm land

on:
  pull_request:
    types: [closed]
  schedule:
    # Idempotent sweep for merged PRs whose scoped IDs are not yet merged.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to land (empty = sweep recent merged PRs)"
        required: false
        type: string
      proof:
        description: "Proof only: bootstrap, push _armature-ci-proof/<run_id>, delete it. Does not land PRs or publish _armature."
        required: false
        type: boolean
        default: false

concurrency:
  group: armature-land
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  GO_VERSION: "1.26.11"

jobs:
  land:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build arm binary
        run: make build

      - name: Fetch ops branch tip (ephemeral header auth)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC1091
          source scripts/github-actions-git-auth.sh
          github_actions_git_auth_export
          (
            unset GITHUB_TOKEN
            export GIT_TERMINAL_PROMPT=0
            git fetch --no-tags origin "+refs/heads/_armature:refs/remotes/origin/_armature" || true
          )

      - name: Attach ops worktree and register CI worker
        run: |
          ./bin/arm bootstrap
          ./bin/arm worker-init --check || ./bin/arm worker-init

      - name: Land merged PR or sweep
        id: land
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.proof != 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: bash scripts/arm-land-ci.sh

      - name: Publish ops (FF-only via arm push-ops)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARM_LAND_PROOF_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.proof == 'true' && format('refs/heads/_armature-ci-proof/{0}', github.run_id) || '' }}
        run: ./bin/arm push-ops

      - name: Delete proof ref
        if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.proof == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROOF_REF: refs/heads/_armature-ci-proof/${{ github.run_id }}
        run: |
          # shellcheck disable=SC1091
          source scripts/github-actions-git-auth.sh
          github_actions_git_auth_export
          (
            unset GITHUB_TOKEN
            export GIT_TERMINAL_PROMPT=0
            git push origin ":${PROOF_REF}"
          )

      - name: Fail job if land failed
        if: ${{ steps.land.outcome == 'failure' }}
        run: |
          echo "arm-land: land step failed after push-ops attempt" >&2
          exit 1
