name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test-os:
    uses: ./.github/workflows/ci.yml
    with:
      os-matrix-only: true

  release:
    needs: test-os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Keep a Changelog (CHANGELOG.md) is the release-notes source.
          args: release --clean --release-notes=CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
