name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test-os:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      os-matrix-only: true

  release:
    needs: test-os
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Install syft
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          echo "$dest" >> "$GITHUB_PATH"
          make install-syft-release DEST="$dest"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.19.0
          args: release --clean --release-notes=CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
