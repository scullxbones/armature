name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # release.yml calls this workflow so tag releases wait on the OS matrix.
  # github.event_name in a called workflow is the caller's event (push on
  # tags), not workflow_call — skip non-matrix jobs via this input instead.
  workflow_call:
    inputs:
      os-matrix-only:
        description: >
          When true, run only the OS test/build matrix. Tag releases pass this
          so check-core, check-static, mutate, validate-graph, and e2eharness
          do not block publishing.
        type: boolean
        required: false
        default: false

env:
  GO_VERSION: "1.26.1"

jobs:
  # T5.1 / TOPTIER-S6-T1: exercise make test + make build on every shipped OS.
  # Lint, coverage, and mutation live in the required check-core / check-static
  # / mutate jobs below. On pull_request/push, Ubuntu does not re-run the unit
  # suite: check-core already produces coverage.out via `make coverage-check`
  # (D3). macos and windows keep the matrix tests. Tag releases call this
  # workflow with os-matrix-only: true (check-core skipped), so Linux still
  # runs make test-ci in that case.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Prefer python launcher on Windows
        if: runner.os == 'Windows'
        run: echo "PYTHON=python" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      # Full make test on macos; windows uses make test-ci (go test -c)
      # because the product runtime is Linux/macOS-only (see README). Ubuntu
      # skips this step on pull_request/push so UNIT_PACKAGES is not paid
      # twice. When os-matrix-only is true, check-core is skipped and Linux
      # must still run the suite.
      - name: Test
        if: ${{ runner.os != 'Linux' || inputs.os-matrix-only }}
        run: make test-ci

      # go test -json output is huge; GHA often truncates it. On failure, re-run
      # cmd/armature and keep FAIL lines (tail alone hid the timeout).
      - name: Diagnose cmd/armature failures
        if: ${{ failure() && runner.os != 'Windows' && (runner.os != 'Linux' || inputs.os-matrix-only) }}
        run: |
          go test -count=1 -timeout 25m -v ./cmd/armature/ 2>&1 | tee /tmp/cmd-armature.log | rg -n 'FAIL|panic|timeout|PASS.*cmd/armature|ok  	github.com/scullxbones/armature/cmd/armature' || true
          tail -n 80 /tmp/cmd-armature.log

  # Skip the heavy ubuntu gate when release.yml reuses this workflow; tag
  # releases only need the OS matrix (test-os) before goreleaser.
  check-core:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # ubuntu-latest does not ship rg. git-test-hermetic-check requires it.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: make check-job JOB=check-core
        env:
          CHECK_INSTALL_TOOLS: "1"

  check-static:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # ubuntu-latest does not ship rg. test-check-jobs uses rg -q.
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: make check-job JOB=check-static
        env:
          CHECK_INSTALL_TOOLS: "1"

  mutate:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make check-job JOB=mutate
        env:
          CHECK_INSTALL_TOOLS: "1"

  # Integration door (D7): whole-graph arm validate --ci. Not part of the
  # per-task publish gate — that gate must stay worker-local. This job is the
  # automated path for make validate-graph; it materializes the ops branch
  # because a PR checkout has no .armature worktree.
  validate-graph:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Attach ops worktree
        run: |
          git fetch --no-tags origin refs/heads/_armature:refs/remotes/origin/_armature
          git worktree add .armature origin/_armature
          git config armature.ops-worktree-path "${GITHUB_WORKSPACE}/.armature"

      - name: Validate issue graph
        run: make validate-graph

  e2eharness:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build arm binary
        run: make build

      - name: Run full e2eharness suite
        run: make test-e2eharness
