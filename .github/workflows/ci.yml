name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Cross-compile
        run: make crosscompile

      - name: Coverage
        run: make coverage-check

      - name: Mutation
        run: make mutate

      - name: Validate skills
        run: make validate-skills

      - name: Validate doc examples
        run: make validate-doc-examples

      - name: Census drift check
        run: make census-drift-check

      - name: Census drift-check regression tests
        run: make test-census-drift-check

  # Integration door (D7): whole-graph arm validate --ci. Not part of the
  # per-task `check` job — that gate must stay worker-local. This job is the
  # automated path for make validate-graph; it materializes the ops branch
  # because a PR checkout has no .armature worktree.
  validate-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Attach ops worktree
        run: |
          git fetch --no-tags origin refs/heads/_armature:refs/remotes/origin/_armature
          git worktree add .armature origin/_armature
          git config armature.ops-worktree-path "${GITHUB_WORKSPACE}/.armature"

      - name: Validate issue graph
        run: make validate-graph

  e2eharness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Build arm binary
        run: make build

      - name: Run full e2eharness suite
        run: make test-e2eharness
