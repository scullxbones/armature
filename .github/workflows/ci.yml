name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # release.yml calls this workflow so tag releases wait on the OS matrix.
  # github.event_name in a called workflow is the caller's event (push on
  # tags), not workflow_call — skip non-matrix jobs via this input instead.
  workflow_call:
    inputs:
      os-matrix-only:
        description: >
          When true, run only the OS test/build matrix. Tag releases pass this
          so check, validate-graph, and e2eharness do not block publishing.
        type: boolean
        required: false
        default: false

jobs:
  # T5.1 / TOPTIER-S6-T1: exercise make test + make build on every shipped OS.
  # Lint, coverage, and mutation stay in the ubuntu-only `check` job below.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Prefer python launcher on Windows
        if: runner.os == 'Windows'
        run: echo "PYTHON=python" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      # Full make test on ubuntu/macos; windows uses make test-ci (go test -c)
      # because the product runtime is Linux/macOS-only (see README).
      - name: Test
        run: make test-ci

      # go test -json output is huge; GHA often truncates it. On failure, re-run
      # cmd/armature and keep FAIL lines (tail alone hid the timeout).
      - name: Diagnose cmd/armature failures
        if: failure() && runner.os != 'Windows'
        run: |
          go test -count=1 -timeout 25m -v ./cmd/armature/ 2>&1 | tee /tmp/cmd-armature.log | rg -n 'FAIL|panic|timeout|PASS.*cmd/armature|ok  	github.com/scullxbones/armature/cmd/armature' || true
          tail -n 80 /tmp/cmd-armature.log

  check:
    # Skip the heavy ubuntu gate when release.yml reuses this workflow; tag
    # releases only need the OS matrix (test-os) before goreleaser.
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Cross-compile
        run: make crosscompile

      - name: Coverage
        run: make coverage-check

      - name: Mutation
        run: make mutate

      - name: Validate skills
        run: make validate-skills

      - name: Validate doc examples
        run: make validate-doc-examples

      - name: Census drift check
        run: make census-drift-check

      - name: Census drift-check regression tests
        run: make test-census-drift-check

  # Integration door (D7): whole-graph arm validate --ci. Not part of the
  # per-task `check` job — that gate must stay worker-local. This job is the
  # automated path for make validate-graph; it materializes the ops branch
  # because a PR checkout has no .armature worktree.
  validate-graph:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Attach ops worktree
        run: |
          git fetch --no-tags origin refs/heads/_armature:refs/remotes/origin/_armature
          git worktree add .armature origin/_armature
          git config armature.ops-worktree-path "${GITHUB_WORKSPACE}/.armature"

      - name: Validate issue graph
        run: make validate-graph

  e2eharness:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Build arm binary
        run: make build

      - name: Run full e2eharness suite
        run: make test-e2eharness
