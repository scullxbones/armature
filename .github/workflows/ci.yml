name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # release.yml calls this workflow so tag releases wait on the OS matrix.
  # github.event_name in a called workflow is the caller's event (push on
  # tags), not workflow_call — skip non-matrix jobs via this input instead.
  workflow_call:
    inputs:
      os-matrix-only:
        description: >
          When true, run only the OS test/build matrix. Tag releases pass this
          so check-core, check-static, mutate, validate-graph, and e2eharness
          do not block publishing.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"

jobs:
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --no-progress -y

      - name: Prefer python launcher on Windows
        if: runner.os == 'Windows'
        run: echo "PYTHON=python" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      # Full make test on macos; windows uses make test-ci (go test -c)
      # because the product runtime is Linux/macOS-only (see README). Ubuntu
      # skips this step on pull_request/push so UNIT_PACKAGES is not paid
      # twice. When os-matrix-only is true, check-core is skipped and Linux
      # must still run the suite.
      - name: Test
        if: ${{ runner.os != 'Linux' || inputs.os-matrix-only }}
        env:
          TEST_JSON_OUT: test-results/go-test.json
        run: make test-ci

      - name: Diagnose cmd/armature failures
        if: ${{ failure() && runner.os != 'Windows' && (runner.os != 'Linux' || inputs.os-matrix-only) }}
        run: |
          go test -count=1 -timeout 25m -v ./cmd/armature/ 2>&1 | tee /tmp/cmd-armature.log | rg -n 'FAIL|panic|timeout|PASS.*cmd/armature|ok  	github.com/scullxbones/armature/cmd/armature' || true
          tail -n 80 /tmp/cmd-armature.log

      # Windows test-ci is compile-only (`go test -c`) and writes no JSON.
      - name: Upload go test JSON
        if: ${{ always() && (runner.os != 'Linux' || inputs.os-matrix-only) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-test-json-${{ matrix.os }}
          path: test-results/go-test.json
          retention-days: 14
          if-no-files-found: ${{ runner.os == 'Windows' && 'ignore' || 'warn' }}

  check-core:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # ubuntu-latest does not ship rg. census/skills scripts and check-core helpers still use it.
      - name: Install ripgrep
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          echo "$dest" >> "$GITHUB_PATH"
          make install-rg-release DEST="$dest"
      - run: make check-job JOB=check-core
        env:
          CHECK_INSTALL_TOOLS: "1"

  check-static:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # ubuntu-latest does not ship rg. test-check-jobs uses rg -q.
      - name: Install ripgrep
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          echo "$dest" >> "$GITHUB_PATH"
          make install-rg-release DEST="$dest"
      - run: make check-job JOB=check-static
        env:
          CHECK_INSTALL_TOOLS: "1"

  mutate:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make check-job JOB=mutate
        env:
          CHECK_INSTALL_TOOLS: "1"

  # Integration door (D7): whole-graph arm validate --ci. Not part of the
  # per-task publish gate — that gate must stay worker-local. This job is the
  # automated path for make validate-graph; it materializes the ops branch
  # because a PR checkout has no .armature worktree.
  validate-graph:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Attach ops worktree
        run: |
          git fetch --no-tags origin refs/heads/_armature:refs/remotes/origin/_armature
          git worktree add .armature origin/_armature
          git config armature.ops-worktree-path "${GITHUB_WORKSPACE}/.armature"

      - name: Validate issue graph
        run: make validate-graph

  e2eharness:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build arm binary
        run: make build

      - name: Run full e2eharness suite
        run: make test-e2eharness

  quickstart:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build arm binary
        run: make build

      - name: Run README quickstart in a scratch repo
        run: bash scripts/quickstart_check.sh

  # Non-blocking until the parallel Go 1.26.10 / goldmark bump lands on main.
  # Do not add this job name to required status checks until that PR merges.
  govulncheck:
    if: ${{ !inputs.os-matrix-only }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install and run govulncheck
        run: |
          ver="$(make -s print-govulncheck-version)"
          go install "golang.org/x/vuln/cmd/govulncheck@${ver}"
          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then gobin="$(go env GOPATH)/bin"; fi
          export PATH="${gobin}:${PATH}"
          govulncheck ./...
