name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # edited: late PR-body coverage paste must re-run quote-check without
    # paying the heavy suite (heavy jobs skip action==edited below).
    types: [opened, synchronize, reopened, edited]
  # github.event_name in a called workflow is the caller's event (push on
  # tags), not workflow_call — skip non-matrix jobs via this input instead.
  workflow_call:
    inputs:
      os-matrix-only:
        description: >
          When true, run only the OS test/build matrix. Tag releases pass this
          so check-core, check-static, mutate, validate-graph, and e2eharness
          do not block publishing.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26.10"
  # Exact floor exercised by check-git-2-34 (source tarball + sha256).
  GIT_MIN_VERSION: "2.34.0"
  GIT_MIN_TARBALL_SHA256: "0ce6222bfd31938b29360150286b51c77c643fa97740b1d35b6d1ceef8b0ecd7"
  GIT_MIN_TARBALL_URL: "https://www.kernel.org/pub/software/scm/git/git-2.34.0.tar.gz"

jobs:
  test-os:
    # Body-only edits must not re-pay the OS matrix.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --version=4.4.1 --no-progress -y

      - name: Prefer python launcher on Windows
        if: runner.os == 'Windows'
        run: echo "PYTHON=python" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      # Full make test on macos; windows uses make test-ci (go test -c)
      # because the product runtime is Linux/macOS-only (see README). Ubuntu
      # skips this step on pull_request/push so UNIT_PACKAGES is not paid
      # twice. When os-matrix-only is true, check-core is skipped and Linux
      # must still run the suite.
      - name: Test
        if: ${{ runner.os != 'Linux' || inputs.os-matrix-only }}
        env:
          TEST_JSON_OUT: test-results/go-test.json
        run: make test-ci

      - name: Diagnose cmd/armature failures
        if: ${{ failure() && runner.os != 'Windows' && (runner.os != 'Linux' || inputs.os-matrix-only) }}
        run: |
          go test -count=1 -timeout 25m -v ./cmd/armature/ 2>&1 | tee /tmp/cmd-armature.log | rg -n 'FAIL|panic|timeout|PASS.*cmd/armature|ok  	github.com/scullxbones/armature/cmd/armature' || true
          tail -n 80 /tmp/cmd-armature.log

      # Windows test-ci is compile-only (`go test -c`) and writes no JSON.
      - name: Upload go test JSON
        if: ${{ always() && (runner.os != 'Linux' || inputs.os-matrix-only) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-test-json-${{ matrix.os }}
          path: test-results/go-test.json
          retention-days: 14
          if-no-files-found: ${{ runner.os == 'Windows' && 'ignore' || 'warn' }}

  # Real Bash 3.2.57: run cross-OS make scripts inside the digest-pinned
  # bash:3.2.57 image. Regex pre-check stays advisory in make lint; this job
  # is the fail-closed proof (bash -n + mutations). Host Bash 4+ must make
  # each mutation fixture exit 0; Bash 3.2 must make each exit non-zero.
  check-bash32:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        env:
          ARM_PATH_SHADOW_WRAPPER_SMOKE: "1"
        run: bash scripts/ci-path-shadow-selfcheck.sh
      - name: Mutation fixtures must succeed under host Bash 4+
        run: bash scripts/prove-bash32-mutations.sh
      - name: Run cross-OS scripts under pinned bash:3.2.57
        # Image via scripts/container-images.manifest key bash-3.2.57 only
        # (scripts/run-container-image.sh — sole docker entrypoint).
        # Closed Alpine v3.22 git .apk set sha256-verified (scripts/alpine-v322-git-apks.sha256),
        # then apk add --no-network; --allow-untrusted only for those verified files.
        run: |
          apkdir="${RUNNER_TEMP:-/tmp}/alpine-git-apks"
          bash scripts/fetch-alpine-git-apks.sh "$apkdir"
          # --allow-untrusted applies only to the sha256-verified .apk paths in $apkdir.
          scripts/run-container-image.sh bash-3.2.57 \
            --rm \
            --entrypoint sh \
            -v "$PWD:/src:ro" \
            -v "$apkdir:/apks:ro" \
            -w /src \
            -- -c 'apk add --no-network --allow-untrusted /apks/*.apk >/dev/null \
              && got=$(git --version) \
              && echo "apk git: $got" \
              && echo "$got" | grep -F "git version 2.49.1" >/dev/null \
              && bash scripts/ci-bash32.sh /src'

  check-core:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # ubuntu-latest does not ship rg. census/skills scripts and check-core helpers still use it.
      - name: Install ripgrep
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          echo "$dest" >> "$GITHUB_PATH"
          make install-rg-release DEST="$dest"
      - run: make check-job JOB=check-core
        env:
          CHECK_INSTALL_TOOLS: "1"
      # Fail-closed quote check (|diff|≤0.10). Reuses coverage.out from this
      # job (no suite re-run); GITHUB_EVENT_PATH only — no gh API. Artifact
      # lets the edited-only job re-compare a late body paste.
      - name: PR body coverage quotes match this job's coverage.out
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test -f coverage.out
          scripts/coverage-check.sh . coverage.out | tee coverage-check.log
          jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH" > /tmp/pr-body.md
          scripts/pr-coverage-quote-check.sh /tmp/pr-body.md coverage-check.log
      - name: Upload coverage-check.log for late PR body paste
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-check-${{ github.event.pull_request.head.sha }}
          path: coverage-check.log
          retention-days: 5
          if-no-files-found: error

  # Body-edit only: re-compare PR body to the head SHA's prior coverage-check
  # log. Does not re-run UNIT_PACKAGES / mutate / OS matrix.
  pr-coverage-quotes-on-edit:
    if: ${{ !inputs.os-matrix-only && github.event_name == 'pull_request' && github.event.action == 'edited' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh
      - name: Download coverage-check.log for this head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="coverage-check-${HEAD_SHA}"
          # Newest non-expired artifact with this exact name (prior check-core).
          id="$(gh api "repos/${REPO}/actions/artifacts?name=${name}&per_page=10" \
            --jq '[.artifacts[] | select(.expired==false)] | .[0].id // empty')"
          if [ -z "$id" ]; then
            echo "FAIL: no coverage-check artifact named ${name}" >&2
            echo "  Push a commit (or re-run check-core) before relying on a late body paste." >&2
            exit 1
          fi
          gh api "repos/${REPO}/actions/artifacts/${id}/zip" > /tmp/coverage-check.zip
          unzip -o -d /tmp/coverage-check-art /tmp/coverage-check.zip
          test -f /tmp/coverage-check-art/coverage-check.log
          cp /tmp/coverage-check-art/coverage-check.log coverage-check.log
      - name: PR body coverage quotes match prior coverage-check.log
        run: |
          set -euo pipefail
          jq -r '.pull_request.body // empty' "$GITHUB_EVENT_PATH" > /tmp/pr-body.md
          scripts/pr-coverage-quote-check.sh /tmp/pr-body.md coverage-check.log

  check-static:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Lean (b): this is the ONE CI job that owns commit-subjects. Pin the PR
      # tip (not the synthetic merge SHA) so origin/main..HEAD lists real commits.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh
      # origin/main fetch + subject gate are PR-only. On push to main,
      # github.sha == the new tip and fetching origin/main makes
      # origin/main..HEAD empty — the empty-range check would fail every
      # main push. Subjects were already gated on the PR (lean b owner).
      # No --depth: checkout already used fetch-depth:0; a shallow main fetch
      # can leave origin/main short of the real branch point so
      # origin/main..HEAD includes pre-branch unscoped commits.
      - name: Fetch origin/main for commit-subjects
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # ubuntu-latest does not ship rg. test-check-jobs uses rg -q.
      - name: Install ripgrep
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          echo "$dest" >> "$GITHUB_PATH"
          make install-rg-release DEST="$dest"
      - name: Check commit subjects on PR tip range
        if: github.event_name == 'pull_request'
        run: make commit-subjects-check
      - run: make check-job JOB=check-static
        env:
          CHECK_INSTALL_TOOLS: "1"

  mutate:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make check-job JOB=mutate
        env:
          CHECK_INSTALL_TOOLS: "1"

  # Exact Git floor (2.34.0) from a checksum-pinned source build. Proves the
  # full CHECK_JOBS suite (incl. S12 ops-backup) on the documented minimum.
  # Uses make check-git-floor — same partitions as other CI jobs — not bare
  # make check: PR merge SHAs have unscoped subjects, so check-commit-subjects
  # would exit before the suite. Partitions do not need origin/main.
  check-git-2-34:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Git build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential dh-autoreconf libcurl4-openssl-dev \
            libexpat1-dev libssl-dev zlib1g-dev

      - name: Install pinned Git ${{ env.GIT_MIN_VERSION }}
        run: |
          dest="${HOME}/git-${GIT_MIN_VERSION}"
          bash scripts/install-git-from-source.sh \
            --version "$GIT_MIN_VERSION" \
            --sha256 "$GIT_MIN_TARBALL_SHA256" \
            --url "$GIT_MIN_TARBALL_URL" \
            --prefix "$dest"
          echo "$dest/bin" >> "$GITHUB_PATH"
          export PATH="$dest/bin:$PATH"
          got="$(git --version)"
          echo "PATH git: $got"
          test "$got" = "git version ${GIT_MIN_VERSION}"

      - name: Assert PATH Git is exactly the pinned floor
        run: |
          got="$(git --version)"
          echo "$got"
          test "$got" = "git version ${GIT_MIN_VERSION}"
          bash scripts/assert-git-min.sh

      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install ripgrep
        run: |
          dest="${HOME}/.local/bin"
          mkdir -p "$dest"
          echo "$dest" >> "$GITHUB_PATH"
          make install-rg-release DEST="$dest"

      - name: Full check suite on Git ${{ env.GIT_MIN_VERSION }}
        env:
          CHECK_INSTALL_TOOLS: "1"
        run: |
          git --version
          make check-git-floor

  # Integration door (D7): whole-graph arm validate --ci. Not part of the
  # per-task publish gate — that gate must stay worker-local. This job is the
  # automated path for make validate-graph; it materializes the ops branch
  # because a PR checkout has no .armature worktree.
  validate-graph:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Attach ops worktree
        run: |
          git fetch --no-tags origin refs/heads/_armature:refs/remotes/origin/_armature
          git worktree add .armature origin/_armature
          git config armature.ops-worktree-path "${GITHUB_WORKSPACE}/.armature"

      - name: Validate issue graph
        run: make validate-graph

  e2eharness:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build arm binary
        run: make build

      - name: Run full e2eharness suite
        run: make test-e2eharness

  quickstart:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build arm binary
        run: make build

      - name: Run README quickstart in a scratch repo
        run: bash scripts/quickstart_check.sh

  govulncheck:
    if: ${{ !inputs.os-matrix-only && (github.event_name != 'pull_request' || github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Assert Git ≥ product minimum
        run: bash scripts/assert-git-min.sh
      - name: PATH-shadow container engines
        run: bash scripts/ci-path-shadow-engines.sh
      - name: PATH-shadow self-check
        run: bash scripts/ci-path-shadow-selfcheck.sh
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install and run govulncheck
        run: |
          ver="$(make -s print-govulncheck-version)"
          go install "golang.org/x/vuln/cmd/govulncheck@${ver}"
          gobin="$(go env GOBIN)"
          if [ -z "$gobin" ]; then gobin="$(go env GOPATH)/bin"; fi
          export PATH="${gobin}:${PATH}"
          govulncheck ./...
