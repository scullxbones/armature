name: Dogfood Finding
description: Report friction or usability issues found while using Armature
labels: ["dogfood-finding"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # Dogfood Finding

        Use this form to report friction, usability issues, or unexpected behavior you encounter while using Armature tools and workflows. This mirrors the internal raw-finding format used under `docs/dogfood/findings/raw/`, so external reports feed the same triage pipeline as internal ones.

        See [docs/agents/dogfood-findings.md](../../docs/agents/dogfood-findings.md) for more context on how we use dogfood findings.

  - type: input
    id: agent
    attributes:
      label: Agent / Writer identity
      description: Who (or what agent/tool) observed this? For AI agents, use the worker identity (e.g. from `arm worker-init --check`); for humans, your name or handle.
      placeholder: claude / codex / jane-doe
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of Armature is this finding related to?
      options:
        - bootstrap
        - hooks
        - skills
        - commands
        - workflow
        - validation
        - coordination
        - tooling
        - documentation
        - other
    validations:
      required: true

  - type: input
    id: task
    attributes:
      label: Task
      description: The issue/task ID or activity you were doing when you hit this (if applicable)
      placeholder: TOPTIER-S9-T1 coordination
    validations:
      required: false

  - type: textarea
    id: user-goal
    attributes:
      label: User Goal
      description: What were you trying to do when you hit this?
      placeholder: |
        e.g. Coordinator claiming wave-1 tasks with `arm claim --worktree ...` per the coordinator skill's dispatch protocol.
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What actually happened? Include exact commands, error messages, and output where possible.
      placeholder: |
        e.g. `git worktree add` failed with `fatal: could not create leading directories ... Read-only file system`.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How did this friction affect the work? Did it block you, cause confusion, or require a workaround?
      placeholder: |
        e.g. Two failed claim attempts and a sandbox bypass before wave dispatch could start.
    validations:
      required: true

  - type: textarea
    id: suggested-follow-up
    attributes:
      label: Suggested Follow-Up
      description: Any ideas for how this could be fixed or improved?
      placeholder: |
        e.g. Coordinator skill could recommend a repo-adjacent worktree root, and/or `arm claim` could fall back to a configurable worktree root.
    validations:
      required: false

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional comma-separated tags for grouping related findings
      placeholder: worktree, sandbox, claim
    validations:
      required: false
