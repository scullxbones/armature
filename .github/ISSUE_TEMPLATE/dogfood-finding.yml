name: Dogfood Finding
description: Report friction or usability issues found while using Armature
labels: ["dogfood-finding"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        # Dogfood Finding
        
        Use this form to report friction, usability issues, or unexpected behavior you encounter while using Armature tools and workflows. These findings help us improve the developer experience.
        
        See [docs/agents/dogfood-findings.md](../../docs/agents/dogfood-findings.md) for more context on how we use dogfood findings.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area of Armature is this finding related to?
      options:
        - bootstrap
        - hooks
        - skills
        - commands
        - workflow
        - validation
        - coordination
        - tooling
        - documentation
        - other
    validations:
      required: true

  - type: textarea
    id: friction-description
    attributes:
      label: Friction Description
      description: What friction did you encounter? What was confusing or didn't work as expected?
      placeholder: |
        Describe the friction you experienced:
        - What were you trying to do?
        - Where did the friction occur?
        - What made it confusing or difficult?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: |
        What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: |
        What actually occurred?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How did this friction impact your work?
      placeholder: |
        - Did it block you?
        - Did it cause confusion?
        - Did it require workarounds?
    validations:
      required: false

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: If applicable, provide steps to reproduce the issue
      placeholder: |
        1. Run `arm ...`
        2. Observe that ...
        3. Expected ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might be helpful
      placeholder: |
        - Armature version: (run `arm --version`)
        - OS and environment details
        - Related documentation or commands
    validations:
      required: false
