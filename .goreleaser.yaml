version: 2

project_name: arm

before:
  hooks:
    - go mod tidy

builds:
  - id: arm
    binary: arm
    main: ./cmd/armature
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - arm
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes are Keep a Changelog (CHANGELOG.md), not auto-generated
# conventional-commit lists. The release workflow passes
# `--release-notes=CHANGELOG.md` so this disable stays in force at publish time.
changelog:
  disable: true

release:
  github:
    owner: scullxbones
    name: armature
  draft: false
  prerelease: auto
  # Attach the canonical changelog alongside binaries/checksums.
  extra_files:
    - glob: ./CHANGELOG.md
