unleash:
  # Limit parallel workers to avoid WSL2 system saturation.
  # 16 workers (nproc) causes all test processes to contend for CPU/disk,
  # pushing individual test runs past the timeout threshold.
  workers: 4

  # Keep each mutant's go test process single-CPU. Without this, each worker can
  # run an unconstrained test process and amplify process churn.
  test-cpu: 1

  # Bound per-mutant timeout amplification. Higher values make timeout mutants
  # look like stalled make check runs.
  timeout-coefficient: 2

  # Files the build tags exclude on the analysis runner (linux) can never be
  # reached by any test run here, yet gremlins still mutates them — every such
  # mutant lands as "not covered", measuring the runner's GOOS rather than test
  # quality. `_windows.go` is excluded by Go's implicit GOOS constraint;
  # filelock_other.go by its explicit `!unix && !windows` tag. That these files
  # compile is gated separately by `make crosscompile`; their behavior is
  # exercised on the platforms that actually build them.
  exclude-files:
    - "_windows\\.go$"
    - "filelock_other\\.go$"

  # Quality gates. mutant-coverage is a de-emphasized SECONDARY reachability
  # proxy: it measures the same thing as `make coverage-check` (statement
  # coverage, now enforced per-tree) from the same `go test` coverage
  # profile, differing only in denominator (mutable AST sites vs. all
  # statements). Statement coverage is the primary, cheaper reachability
  # gate. mutant-coverage dropped from 95 to 92 as a ONE-TIME correction of
  # an unintended double gate: reachability is now enforced primarily and
  # more cheaply by per-tree statement coverage (Decision 2), so
  # mutant-coverage no longer needs to carry that signal at 95. It stays a
  # SINGLE repo-wide number (Decision 4)
  # — a per-tree split was considered and deliberately rejected as not worth
  # the added configuration surface. efficacy remains at 99, unchanged, and
  # is the primary mutation-quality signal — it measures what mutant-coverage
  # cannot: whether covered mutants are actually killed. See ADR 0015
  # (docs/adr/0015-recalibrate-mutation-and-coverage-gates.md) Decisions 2
  # and 4.
  # threshold-mcover: % of mutation sites reachable by tests (analogous to code coverage).
  # threshold-efficacy: % of executed mutations killed by tests (test quality signal).
  threshold:
    mutant-coverage: 92
    efficacy: 99
