version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - staticcheck
    - misspell
    - unconvert
    - depguard
  settings:
    depguard:
      rules:
        domain-no-adapters:
          list-mode: lax
          files:
            - "**/internal/materialize/*.go"
            - "**/internal/dag/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal/platform"
              desc: "domain packages must not import adapter packages"
            - pkg: "github.com/scullxbones/armature/internal/sources"
              desc: "domain packages must not import adapter packages"

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

issues:
  exclude-use-default-excludes: false

formatters:
  enable:
    - goimports
