version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - staticcheck
    - misspell
    - unconvert
    # - depguard  # TODO(QLTYCNTRL-S1-T1): Enable once golangci-lint 2.11.4 depguard Main rule issue is resolved

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  depguard:
    rules:
      Main:
        allow-list:
          - "builtin"
          - "$stdlib"
          - "github.com"
      domain-no-adapters:
        list-mode: lax
        files:
          - "internal/materialize/**/*.go"
          - "internal/dag/**/*.go"
        deny:
          - pkg: "github.com/scullxbones/armature/internal/platform"
            desc: "domain packages must not import adapter packages"
          - pkg: "github.com/scullxbones/armature/internal/sources"
            desc: "domain packages must not import adapter packages"

issues:
  exclude-use-default-excludes: false

formatters:
  enable:
    - goimports
