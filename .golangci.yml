version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - ineffassign
    - staticcheck
    - misspell
    - unconvert
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        domain-no-adapters:
          list-mode: lax
          files:
            - "**/internal/materialize/*.go"
            - "**/internal/dag/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal/platform"
              desc: "domain packages must not import adapter packages"
            - pkg: "github.com/scullxbones/armature/internal/sources"
              desc: "domain packages must not import adapter packages"
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/spf13/pflag.FlagSet).GetBool
        - (*github.com/spf13/pflag.FlagSet).GetInt
        - (*github.com/spf13/pflag.FlagSet).GetString
        - (*github.com/spf13/pflag.FlagSet).GetStringSlice
        - (*github.com/spf13/pflag.FlagSet).Set
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
    forbidigo:
      forbid:
        - pattern: '^time\.Now$'
          msg: 'use injected clock parameters instead of time.Now()'
  exclusions:
    rules:
      - linters:
          - forbidigo
        path: 'cmd/'
      - linters:
          - forbidigo
        path: '_test\.go$'
      - linters:
          - forbidigo
        path: 'internal/clock/'
      - linters:
          - forbidigo
        path: 'internal/tui/'

formatters:
  enable:
    - goimports
