version: "2"

linters:
  default: none
  enable:
    - forbidigo
    - depguard
    - gosec
    - govet
    - contextcheck
    - containedctx
    - bodyclose
    - noctx
    - copyloopvar
    - tparallel
    - paralleltest
    - staticcheck
    - errcheck
    - unparam
    - gocritic
    - revive
    - lll
    - ineffassign
    - misspell
    - unconvert
    - nolintlint
    # Catches package-level mutable vars (incl. test-injection func hooks).
    # claim/oporder/promotion stay fully covered — reintroduced hooks fail make lint.
    - gochecknoglobals
  settings:
    depguard:
      # Modularity map (quality-controls C7; ADR 0004 fences; ADR 0023 ratchet).
      # Widening an allow-list or removing a deny requires an ADR.
      # mock-ban is a new deny (map extension, ADR 0023 Decision 3), not a
      # widen of any existing fence. It implements C1 / R1.
      rules:
        mock-ban:
          list-mode: lax
          files:
            - "**/*.go"
          deny:
            - pkg: "github.com/stretchr/testify/mock"
              desc: "mock frameworks are banned (R1); write a fake per port. testify/assert and testify/require stay allowed"
            - pkg: "github.com/golang/mock"
              desc: "gomock is banned (R1); write a fake per port"
            - pkg: "go.uber.org/mock"
              desc: "uber gomock is banned (R1); write a fake per port"
            - pkg: "github.com/vektra/mockery"
              desc: "mockery is banned (R1); do not import the generator or its output helpers"
            - pkg: "github.com/petergtz/pegomock"
              desc: "pegomock is banned (R1); write a fake per port"
            - pkg: "github.com/maxbrunsfeld/counterfeiter"
              desc: "counterfeiter is banned (R1); write a fake per port"
            - pkg: "github.com/matryer/moq"
              desc: "moq is banned (R1); write a fake per port"
            - pkg: "github.com/derision-test/go-mockgen"
              desc: "go-mockgen is banned (R1); write a fake per port"
            - pkg: "github.com/DATA-DOG/go-sqlmock"
              desc: "sqlmock is banned (R1); write a fake per port"
            - pkg: "github.com/agiledragon/gomonkey"
              desc: "gomonkey is banned (R1); write a fake per port"
            - pkg: "github.com/prashantv/gostub"
              desc: "gostub is banned (R1); write a fake per port"
            - pkg: "github.com/undefinedlabs/go-mpatch"
              desc: "go-mpatch is banned (R1); write a fake per port"
            - pkg: "github.com/bouk/monkey"
              desc: "bouk/monkey is banned (R1); write a fake per port"
            - pkg: "github.com/bytedance/mockey"
              desc: "mockey is banned (R1); write a fake per port"
            - pkg: "github.com/gojuno/minimock"
              desc: "minimock is banned (R1); write a fake per port"
        internal-no-cmd:
          list-mode: lax
          files:
            - "**/internal/**/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/cmd"
              desc: "internal packages must not import cmd packages"
        dag-pure:
          list-mode: lax
          files:
            - "**/internal/dag/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal"
              desc: "dag is a pure graph package and must not import other internal packages"
        issuetype-pure:
          list-mode: lax
          files:
            - "**/internal/issuetype/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal"
              desc: "issuetype is a pure vocabulary package and must not import other internal packages"
        scopematch-pure:
          list-mode: lax
          files:
            - "**/internal/scopematch/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal"
              desc: "scopematch is a pure glob-matching package and must not import other internal packages"
        issueref-pure:
          list-mode: lax
          files:
            - "**/internal/issueref/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal"
              desc: "issueref is a pure projection type and must not import other internal packages"
        attestation-pure:
          list-mode: lax
          files:
            - "**/internal/attestation/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal"
              desc: "attestation is a pure vocabulary package and must not import other internal packages"
        output-pure:
          list-mode: lax
          files:
            - "**/internal/output/*.go"
            - "!**/*_test.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal"
              desc: "output is a pure presentation package and must not import other internal packages"
        ops-boundary:
          list-mode: strict
          files:
            - "**/internal/ops/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
        claim-boundary:
          list-mode: strict
          files:
            - "**/internal/claim/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/ops"
            - "github.com/scullxbones/armature/internal/scopematch"
        traceability-boundary:
          list-mode: strict
          files:
            - "**/internal/traceability/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
            - "github.com/scullxbones/armature/internal/issueref"
        materialize-boundary:
          list-mode: strict
          files:
            - "**/internal/materialize/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
            - "github.com/scullxbones/armature/internal/claim"
            - "github.com/scullxbones/armature/internal/dag"
            - "github.com/scullxbones/armature/internal/issueid"
            - "github.com/scullxbones/armature/internal/issueref"
            - "github.com/scullxbones/armature/internal/oporder"
            - "github.com/scullxbones/armature/internal/attestation"
            - "github.com/scullxbones/armature/internal/ops"
            - "github.com/scullxbones/armature/internal/traceability"
        sources-boundary:
          list-mode: strict
          files:
            - "**/internal/sources/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
            - "github.com/scullxbones/armature/internal/clock"
        validate-boundary:
          list-mode: strict
          files:
            - "**/internal/validate/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/dag"
            - "github.com/scullxbones/armature/internal/issuetype"
            - "github.com/scullxbones/armature/internal/scopematch"
            - "github.com/scullxbones/armature/internal/taskcontract"
        context-boundary:
          list-mode: strict
          files:
            - "**/internal/context/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/charmbracelet/glamour"
            - "github.com/scullxbones/armature/internal/dag"
        contextreport-boundary:
          list-mode: strict
          files:
            - "**/internal/contextreport/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/context"
            - "github.com/scullxbones/armature/internal/materialize"
            - "github.com/scullxbones/armature/internal/ops"
            - "github.com/scullxbones/armature/internal/output"
            - "github.com/scullxbones/armature/internal/ready"
            - "github.com/scullxbones/armature/internal/review"
        ready-boundary:
          list-mode: strict
          files:
            - "**/internal/ready/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/dag"
            - "github.com/scullxbones/armature/internal/issuetype"
            - "github.com/scullxbones/armature/internal/scopematch"
        review-boundary:
          list-mode: strict
          files:
            - "**/internal/review/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/attestation"
            - "github.com/scullxbones/armature/internal/issuetype"
            - "github.com/scullxbones/armature/internal/strictjson"
        worktree-pure:
          list-mode: strict
          files:
            - "**/internal/worktree/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
        worker-boundary:
          list-mode: strict
          files:
            - "**/internal/worker/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/google/uuid"
            - "github.com/scullxbones/armature/internal/adapters"
            - "github.com/scullxbones/armature/internal/claim"
            - "github.com/scullxbones/armature/internal/filelock"
        deliverygate-boundary:
          list-mode: strict
          files:
            - "**/internal/deliverygate/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
            - "github.com/scullxbones/armature/internal/commitref"
            - "github.com/scullxbones/armature/internal/scopematch"
            - "github.com/scullxbones/armature/internal/worktree"
        harnesshook-boundary:
          list-mode: strict
          files:
            - "**/internal/harnesshook/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
            - "github.com/scullxbones/armature/internal/clock"
            - "github.com/scullxbones/armature/internal/harnesspolicy"
            - "github.com/scullxbones/armature/internal/worktree"
        harnesspolicy-boundary:
          list-mode: strict
          files:
            - "**/internal/harnesspolicy/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/scopematch"
        promotion-boundary:
          list-mode: strict
          files:
            - "**/internal/promotion/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
            - "github.com/scullxbones/armature/internal/claim"
            - "github.com/scullxbones/armature/internal/delivery"
            - "github.com/scullxbones/armature/internal/ops"
        doctor-boundary:
          list-mode: strict
          files:
            - "**/internal/doctor/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/scullxbones/armature/internal/adapters"
            - "github.com/scullxbones/armature/internal/config"
            - "github.com/scullxbones/armature/internal/dag"
            - "github.com/scullxbones/armature/internal/harnesspolicy"
            - "github.com/scullxbones/armature/internal/materialize"
            - "github.com/scullxbones/armature/internal/ops"
            - "github.com/scullxbones/armature/internal/ready"
            - "github.com/scullxbones/armature/internal/redact"
            - "github.com/scullxbones/armature/internal/worktree"
        decompose-boundary:
          list-mode: strict
          files:
            - "**/internal/decompose/*.go"
            - "!**/*_test.go"
          allow:
            - "$gostd"
            - "github.com/google/uuid"
            - "github.com/scullxbones/armature/internal/clock"
            - "github.com/scullxbones/armature/internal/issueid"
            - "github.com/scullxbones/armature/internal/issuetype"
            - "github.com/scullxbones/armature/internal/materialize"
            - "github.com/scullxbones/armature/internal/ops"
            - "github.com/scullxbones/armature/internal/strictjson"
            - "github.com/scullxbones/armature/internal/validate"
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/spf13/pflag.FlagSet).GetBool
        - (*github.com/spf13/pflag.FlagSet).GetInt
        - (*github.com/spf13/pflag.FlagSet).GetString
        - (*github.com/spf13/pflag.FlagSet).GetStringSlice
        - (*github.com/spf13/pflag.FlagSet).Set
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
    forbidigo:
      forbid:
        - pattern: '^time\.Now$'
          msg: 'use injected clock parameters instead of time.Now()'
        - pattern: '^os\.Getenv$'
          msg: 'use Env.Lookup from the Invocation instead of os.Getenv()'
        - pattern: '^os\.LookupEnv$'
          msg: 'use Env.Lookup from the Invocation instead of os.LookupEnv()'
        - pattern: '^os\.Chdir$'
          msg: 'use Invocation.Dir instead of os.Chdir()'
        - pattern: '^os\.TempDir$'
          msg: 'use Invocation.TempDir instead of os.TempDir()'
    revive:
      rules:
        - name: exported
          arguments:
          - checkPrivateReceivers: true
          disabled: true
        - name: package-comments
    lll:
      line-length: 160
  exclusions:
    rules:
      - linters:
          - forbidigo
        path: 'cmd/'
        text: 'time.Now'
      - linters:
          - forbidigo
        path: 'cmd/armature/invocation.go'
      - linters:
          - forbidigo
        path: 'internal/tui/tty.go'
      - linters:
          - forbidigo
        path: '_test\.go$'
      - linters:
          - forbidigo
        path: 'internal/clock/'
      - linters:
          - forbidigo
        path: 'internal/tui/app/'
      - linters:
          - gosec
        path: '_test\.go$'
        text: 'G104|G204|G301|G302|G304|G306'
      # G115: uintptr→int for terminal fd — well-established pattern, value bounded by OS
      - linters:
          - gosec
        text: 'G115'
      # cmd/armature tests call t.Parallel at the Test* level; many t.Run
      # subtests share a repo fixture and cannot all be marked parallel.
      - linters:
          - paralleltest
          - tparallel
        path: 'cmd/'
      # testexec owns a process-wide trampoline; error-path tests reset it and
      # cannot run beside t.Parallel helpers in the same package.
      - linters:
          - paralleltest
          - tparallel
        path: 'internal/testexec/'
      - linters:
          - paralleltest
          - tparallel
        path: 'internal/skilltranscript/golden_test\.go'
      # CI ratchet helper: reads/writes a path the operator passes (repo root).
      - linters:
          - gosec
        path: 'scripts/surfacebudget/'
      - linters:
          - gosec
        path: 'scripts/repoguard/'

formatters:
  enable:
    - goimports
