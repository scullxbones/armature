version: "2"

linters:
  default: none
  enable:
    # --- Architectural Structure ---
    - forbidigo
    - depguard

    # --- Critical Input & Host Security ---
    - gosec
    - govet

    # --- Context & Execution Control ---
    - contextcheck
    - containedctx
    - bodyclose
    - noctx

    # --- Concurrency & Test Robustness ---
    - copyloopvar
    - tparallel
    - paralleltest
    - staticcheck
    - errcheck

    # --- Hygiene ---
    - unparam
    - gocritic
    - revive
    - lll
    - ineffassign
    - misspell
    - unconvert
    - nolintlint
  settings:
    depguard:
      rules:
        # internal packages must never import cmd — cmd is the entry point, not a library
        internal-no-cmd:
          list-mode: lax
          files:
            - "**/internal/**/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/cmd"
              desc: "internal packages must not import cmd packages"
        # dag is pure graph logic; any internal import would couple it to infrastructure
        dag-pure:
          list-mode: lax
          files:
            - "**/internal/dag/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal"
              desc: "dag is a pure graph package and must not import other internal packages"
        # Domain primitives (ops, claim, traceability, materialize) must not import
        # higher-level adapter wrappers (platform, sources) — those belong above them
        domain-no-adapters:
          list-mode: lax
          files:
            - "**/internal/materialize/*.go"
            - "**/internal/ops/*.go"
            - "**/internal/claim/*.go"
            - "**/internal/traceability/*.go"
          deny:
            - pkg: "github.com/scullxbones/armature/internal/platform"
              desc: "domain primitives must not import adapter packages"
            - pkg: "github.com/scullxbones/armature/internal/sources"
              desc: "domain primitives must not import adapter packages"
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*github.com/spf13/pflag.FlagSet).GetBool
        - (*github.com/spf13/pflag.FlagSet).GetInt
        - (*github.com/spf13/pflag.FlagSet).GetString
        - (*github.com/spf13/pflag.FlagSet).GetStringSlice
        - (*github.com/spf13/pflag.FlagSet).Set
        - (*github.com/spf13/cobra.Command).MarkFlagRequired
    forbidigo:
      forbid:
        - pattern: '^time\.Now$'
          msg: 'use injected clock parameters instead of time.Now()'
    revive:
      rules:
        - name: exported
          arguments:
          - checkPrivateReceivers: true
          disabled: true
        - name: package-comments
          disabled: true
    lll:
      line-length: 160
  exclusions:
    rules:
      - linters:
          - forbidigo
        path: 'cmd/'
      - linters:
          - forbidigo
        path: '_test\.go$'
      - linters:
          - forbidigo
        path: 'internal/clock/'
      - linters:
          - forbidigo
        path: 'internal/tui/'
      # G204: subprocess launched with variable — inherent to git/shell adapter
      # G301/G302: directory/file permissions in tests use 0755 for git repo traversal
      - linters:
          - gosec
        path: '_test\.go$'
        text: 'G104|G204|G301|G302|G304|G306'
      # G115: uintptr→int for terminal fd — well-established pattern, value bounded by OS
      - linters:
          - gosec
        text: 'G115'
      # cmd/ integration tests invoke cobra in-process (newRootCmd().Execute()), which shares
      # process-global state: env vars (t.Setenv), os.Args, and cobra initialization. Each test
      # has its own t.TempDir() so on-disk state is isolated and production code has no races;
      # the constraint is the in-process execution model, not the production code itself.
      - linters:
          - paralleltest
        path: 'cmd/'

formatters:
  enable:
    - goimports
